name: Forge Benchmarks

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/forge-benchmark.yml
      - forge_versions.csv

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse CSV and build matrix
        id: set-matrix
        run: |
          matrix=$(tail -n +2 forge_versions.csv | awk -F, '
            {
              gsub(/"/, "", $1);
              gsub(/"/, "", $2);
              split($1, d, "-");
              month = d[1] "-" d[2];
              url = $2;
              seen[month] = url;
            }
            END {
              printf "[";
              count = 0;
              for (m in seen) count++;
              i = 0;
              for (m in seen) {
                printf "{\"month\":\"%s\",\"url\":\"%s\"}", m, seen[m];
                if (++i < count) printf ",";
              }
              print "]";
            }
          ')

          # Validate JSON before output
          echo "$matrix" | jq . > /dev/null || { echo "❌ Invalid JSON matrix"; exit 1; }

          # Safe multiline output
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$matrix" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


  benchmark:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: Benchmark ${{ matrix.month }}
    steps:
      - name: Checkout Solady
        uses: actions/checkout@v4
        with:
          repository: Vectorized/solady
          path: solady

      - name: Install foundryup (optional fallback)
        run: curl -L https://foundry.paradigm.xyz | bash

      - name: Download forge binary
        run: |
          curl -L "${{ matrix.url }}" -o forge.tar.gz
          mkdir -p forge-bin
          tar -xzf forge.tar.gz -C forge-bin
          chmod +x forge-bin/forge
          echo "$(pwd)/forge-bin" >> $GITHUB_PATH

      - name: Run benchmark
        working-directory: solady
        run: |
          start=$(date +%s%N)
          forge build >/dev/null 2>&1
          end=$(date +%s%N)
          duration=$(( (end - start) / 1000000 ))
          echo "Forge version from ${{ matrix.month }} took $duration ms to compile Solady"

      - name: Upload benchmark result
        run: echo "${{ matrix.month }},$duration" >> $GITHUB_STEP_SUMMARY
